[project]
name = "memento"
version = "0.1.0"
description = "Memories that know when they matter: every memory carries a Python recipe, Jev fires it."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[typesafe,openai]>=2.51.0",
    "river-client==0.12.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "ruff>=0.6",
    "google-auth-oauthlib>=1.4.1",
]

[project.scripts]
memento = "memento.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memento"]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
