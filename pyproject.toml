[project]
name = "memento"
version = "0.1.0"
description = "Proactive memory for GBrain: every memory can carry a Python recipe that says when it should come back."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[typesafe]>=2.51",
    "river-client>=0.12",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
memento = "memento.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memento"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
